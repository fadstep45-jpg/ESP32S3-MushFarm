name: firmware build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with ESP-IDF Docker
        run: |
          docker pull espressif/idf:v5.3.2
          docker run --rm -v "${{ github.workspace }}:/project" -w /project/firmware espressif/idf:v5.3.2 idf.py set-target esp32s3
          docker run --rm -v "${{ github.workspace }}:/project" -w /project/firmware espressif/idf:v5.3.2 idf.py build

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: mushfarm-fw
          path: |
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/*.bin
          if-no-files-found: warn
