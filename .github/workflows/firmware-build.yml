name: firmware build (arduino-cli)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ESP32_CORE_VERSION: 3.0.7
      FQBN: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,PartitionScheme=default
      SKETCH_DIR: firmware/mushfarm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute short SHA
        id: gitsha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write git metadata header
        run: |
          printf '#pragma once\n#define MF_GIT_SHORT_SHA "%s"\n' \
            "${{ steps.gitsha.outputs.short }}" > firmware/mushfarm/mf_git_info.h

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cache arduino-cli data
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-esp32-${{ env.ESP32_CORE_VERSION }}-${{ hashFiles('firmware/arduino-libs.txt') }}
          restore-keys: |
            arduino-${{ runner.os }}-esp32-${{ env.ESP32_CORE_VERSION }}-

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${ESP32_CORE_VERSION}

      - name: Install libraries
        run: |
          # Avoid duplicate ArduinoJson folders breaking lib install / compile.
          rm -rf "$HOME/Arduino/libraries/ArduinoJson"*
          grep -v '^[[:space:]]*#' firmware/arduino-libs.txt | grep -v '^[[:space:]]*$' | while read -r spec; do
            arduino-cli lib install "$spec"
          done

      - name: Compile sketch
        run: |
          set -o pipefail
          arduino-cli compile \
            --fqbn "${FQBN}" \
            --output-dir build \
            --warnings more \
            "${SKETCH_DIR}" 2>&1 | tee compile.log

      - name: Upload compile log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: compile.log

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mushfarm-fw
          path: |
            build/*.bin
            build/*.elf
            build/*.map
          if-no-files-found: warn
